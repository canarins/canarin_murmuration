# Local dev stack for Murmuration (mirrors prod: MySQL 8.4 + Redis 7).
#   mysql — stands in for the Canarin RDS; schemas Devices/WebFront/Data are created
#           by `murmuration migrate` (dev stub) — never apply that stub in prod
#   redis — model state AND the Birdhouse fan-out stream (birdhouse:fanout)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: plumage
      MYSQL_PASSWORD: plumage
      MYSQL_DATABASE: Murmuration
    command: ["mysqld", "--default-time-zone=+00:00"]
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uplumage", "-pplumage"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["6379:6379"]

  murmuration:
    build: .
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      DB_HOST: mysql
      DB_USER: root            # the dev stub creates schemas; prod user is murmuration_app
      DB_PASS: root
      REDIS_HOST: redis
      REDIS_TLS: "false"
      MURM_ARTIFACTS: file:///artifacts
    volumes:
      - artifacts:/artifacts
    command: ["sh", "-c", "murmuration migrate && murmuration run --interval 300"]

volumes:
  artifacts:
