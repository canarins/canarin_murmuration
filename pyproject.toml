[project]
name = "murmuration"
version = "0.1.0"
description = "Canarin Murmuration — pollution world-model inference service (nowcast, virtual sensors, device trust)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
murmuration = "murmuration.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["murmuration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Postgres + Redis (see README)"]
